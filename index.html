<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Squid Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: rgb(226, 198, 71);
            color: white;
            text-align: center;
        }
        img {
            width: 80%;
            max-width: 300px;
            height: auto;
        }
        h1 {
            margin-top: 30px;
            font-size: 45px;
        }
        h2{
            margin-top: 15px;
            font-size: 20px;
            color: pink;
            border: 1px solid red;
            border-radius: 10px;
        }
        span{
            font-size: 30px;
            color: rgb(233, 77, 103);
        }
    </style>
</head>
<body>
    <img src="./img/image.png" alt="">
    <h1>Squid Game</h1>
    <h2>Made only for <br> <span>Shoyakubova Farangiz</span></h2>
</body>
</html>
